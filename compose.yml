services:
  frontend:
    image: appimage
    ports:
      - "1111:8080"
    depends_on:
      - devopsdb

  devopsdb:
    image: dbimage
    ports:
      - "1112:3306"
    volumes:
      - mydata:/var/lib/mysql
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: "500M"
        limits:
          cpus: "1"
          memory: "1000M"
    environment:
     - MYSQL_ROOT_PASSWORD=devopspassword
     

volumes:
  mydata:
