services:
  frontend:
    image: vasavigubba/mydocker:practicewebappfrontend
    ports:
      - "1111:8080"
    deploy:
     replicas: 2
    networks:
     - mynetwork
    depends_on:
      - devopsdb

  devopsdb:
    image: vasavigubba/mydocker:practicewebappdatabase
    ports:
      - "1112:3306"
    volumes:
      - mydata:/var/lib/mysql
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: "500M"
        limits:
          cpus: "1"
          memory: "1000M"


    networks:
     - mynetwork

    environment:
     - MYSQL_ROOT_PASSWORD=devopspassword


volumes:
  mydata:

networks:
  mynetwork:
    driver: overlay
